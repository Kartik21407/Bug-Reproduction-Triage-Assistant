# Alembic configuration.
# The database URL is not stored here. It is read from DATABASE_URL by
# alembic/env.py, so that no credentials are ever committed.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
version_path_separator = os
# Migration files are prefixed with the date so that history reads in order.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
