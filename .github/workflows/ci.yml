name: CI

# Quoted because an unquoted "on" is read as the boolean true by YAML parsers.
"on":
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: bugtriage
          POSTGRES_PASSWORD: bugtriage
          POSTGRES_DB: bugtriage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bugtriage"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: ci
      DATABASE_URL: postgresql+psycopg://bugtriage:bugtriage@localhost:5432/bugtriage_test
      JWT_SECRET_KEY: ci-only-secret-not-used-anywhere-else
      JWT_ALGORITHM: HS256
      SESSION_EXPIRE_MINUTES: "60"
      SESSION_COOKIE_NAME: session
      COOKIE_SECURE: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        working-directory: backend
        run: ruff check .

      - name: Check formatting
        working-directory: backend
        run: ruff format --check .

      - name: Test
        working-directory: backend
        run: pytest -q

  frontend:
    name: Frontend (ESLint + Prettier + Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test -- --run
